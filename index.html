                            <span class="font-extrabold text-slate-200 block mb-0.5"><i class="fa-solid fa-language text-blue-400 mr-1"></i> Machine Translation</span>
                            <span class="text-slate-450 text-[10px] leading-relaxed">Penerjemahan dinamis antar-bahasa alami.</span>
                        </div>
                        <div class="bg-slate-850/30 p-3 rounded-xl border border-slate-800 hover:border-indigo-500/20 transition-all text-xs">
                            <span class="font-extrabold text-slate-200 block mb-0.5"><i class="fa-solid fa-compress text-pink-400 mr-1"></i> Text Summarization</span>
                            <span class="text-slate-450 text-[10px] leading-relaxed">Meringkas dokumen teks artikel panjang secara otomatis.</span>
                        </div>
                        <div class="bg-slate-850/30 p-3 rounded-xl border border-slate-800 hover:border-indigo-500/20 transition-all text-xs">
                            <span class="font-extrabold text-slate-200 block mb-0.5"><i class="fa-solid fa-robot text-emerald-400 mr-1"></i> Chatbot Interaction</span>
                            <span class="text-slate-450 text-[10px] leading-relaxed">Asisten percakapan cerdas di sektor industri.</span>
                        </div>
                        <div class="bg-slate-850/30 p-3 rounded-xl border border-slate-800 hover:border-indigo-500/20 transition-all text-xs">
                            <span class="font-extrabold text-slate-200 block mb-0.5"><i class="fa-solid fa-circle-question text-amber-400 mr-1"></i> Question Answering</span>
                            <span class="text-slate-450 text-[10px] leading-relaxed">Sistem penjawab kueri kognitif berbasis referensi dokumen.</span>
                        </div>
                    </div>
                `
            },
            // Slide 30: Recap & Transition
            {
                title: "Recap & Transition",
                subtitle: "Rangkuman Hari Ini & Pratinjau Sesi Berikutnya",
                content: `
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-8 items-center h-full py-4">
                        <div class="space-y-4">
                            <h3 class="text-lg font-bold text-white">Evaluasi Pembelajaran Hari Ini</h3>
                            <div class="grid grid-cols-2 gap-2 text-[10px] text-slate-400">
                                <div class="bg-slate-900/50 p-2.5 rounded-lg border border-slate-800"><i class="fa-solid fa-check text-emerald-400 mr-1"></i> NLP Pipeline Alur</div>
                                <div class="bg-slate-900/50 p-2.5 rounded-lg border border-slate-800"><i class="fa-solid fa-check text-emerald-400 mr-1"></i> Preprocessing Teks</div>
                                <div class="bg-slate-900/50 p-2.5 rounded-lg border border-slate-800"><i class="fa-solid fa-check text-emerald-400 mr-1"></i> BoW & TF-IDF</div>
                                <div class="bg-slate-900/50 p-2.5 rounded-lg border border-slate-800"><i class="fa-solid fa-check text-emerald-400 mr-1"></i> Transformer & LLM</div>
                            </div>
                        </div>
                        <div class="bg-indigo-950/20 border border-indigo-500/20 p-5 rounded-2xl space-y-3">
                            <h4 class="font-extrabold text-xs text-indigo-300 uppercase tracking-wider">Next Week: NLP Implementation</h4>
                            <p class="text-[10px] text-slate-400 leading-relaxed">
                                Sesi berikutnya kita akan langsung mempraktikkan pengolahan dataset ulasan menggunakan kueri bahasa pemrograman Python:
                            </p>
                            <div class="bg-slate-950 p-2.5 rounded border border-slate-850 font-mono text-[9px] text-slate-300 text-center">
                                Dataset &rarr; Preprocess &rarr; TF-IDF &rarr; Naive Bayes &rarr; Evaluasi
                            </div>
                        </div>
                    </div>
                `
            }
        ];

        let currentSlide = 0;

        // Populate Slide Selector dropdown list
        function initSelector() {
            const selector = document.getElementById('slide-selector');
            selector.innerHTML = '';
            slides.forEach((slide, index) => {
                const opt = document.createElement('option');
                opt.value = index;
                opt.textContent = `Slide ${index + 1}: ${slide.title}`;
                selector.appendChild(opt);
            });
            document.getElementById('total-slides-num').textContent = slides.length;
        }

        // Render current active slide to view element
        function renderSlide() {
            const viewer = document.getElementById('slide-viewer');
            const data = slides[currentSlide];
            
            // Fade-out transform animation
            viewer.style.opacity = '0';
            viewer.style.transform = 'translateY(8px)';
            
            setTimeout(() => {
                viewer.innerHTML = `
                    <div class="flex flex-col justify-between h-full space-y-6">
                        <div class="border-b border-slate-800 pb-4">
                            <h2 class="text-2xl md:text-3xl font-extrabold text-white tracking-tight leading-tight">${data.title}</h2>
                            <p class="text-xs text-indigo-400 font-bold mt-1 uppercase tracking-wider">${data.subtitle}</p>
                        </div>
                        <div class="flex-grow">
                            ${data.content}
                        </div>
                    </div>
                `;
                
                // Update select element value & current numerical indices
                document.getElementById('current-slide-num').textContent = currentSlide + 1;
                document.getElementById('slide-selector').value = currentSlide;
                
                // Math conversion for visual progress bar width
                const progressPercent = ((currentSlide + 1) / slides.length) * 100;
                document.getElementById('progress-bar').style.width = `${progressPercent}%`;
                
                // Toggle disables on controllers
                document.getElementById('btn-prev').disabled = currentSlide === 0;
                document.getElementById('btn-next').disabled = currentSlide === slides.length - 1;
                
                // Fade-in transform animation
                viewer.style.opacity = '1';
                viewer.style.transform = 'translateY(0)';
            }, 200);
        }

        // Navigation controls
        function nextSlide() {
            if (currentSlide < slides.length - 1) {
                currentSlide++;
                renderSlide();
            }
        }

        function prevSlide() {
            if (currentSlide > 0) {
                currentSlide--;
                renderSlide();
            }
        }

        function goToSlide(index) {
            currentSlide = parseInt(index);
            renderSlide();
        }

        // Slide 8: Interactive Pipeline Handler
        function showPipelineDetail(stage) {
            const box = document.getElementById('pipe-detail');
            if (!box) return;
            
            if (stage === 'raw') {
                box.innerHTML = `<strong class="text-indigo-400">1. Raw Text:</strong> Pengumpulan dokumen teks mentah dari database, website, dokumen fisik, atau ulasan media sosial.`;
            } else if (stage === 'prep') {
                box.innerHTML = `<strong class="text-purple-400">2. Preprocessing:</strong> Pembersihan data (*case folding, cleaning, tokenization, stopword removal, stemming*) demi meminimalkan noise kata.`;
            } else if (stage === 'feat') {
                box.innerHTML = `<strong class="text-blue-400">3. Feature Extraction (Represent):</strong> Konversi token kata dasar menjadi matriks representasi numerik kontinu (BoW, TF-IDF, atau Embedding).`;
            } else if (stage === 'mod') {
                box.innerHTML = `<strong class="text-pink-400">4. Model NLP:</strong> Melatih algoritma machine learning (Naive Bayes, SVM) atau neural network untuk mempelajari pola semantik teks.`;
            } else if (stage === 'pred') {
                box.innerHTML = `<strong class="text-emerald-400">5. Prediction/Output:</strong> Hasil akhir berupa label keputusan klasifikasi, ringkasan teks, ataupun terjemahan bahasa.`;
            }
        }

        // Slide 12: Interactive Cleaning Text Simulation
        function simulateTextCleaning() {
            const output = document.getElementById('cleaning-output');
            if (output) {
                output.style.opacity = '0';
                setTimeout(() => {
                    output.textContent = '"wah asyik banget belajar nlp"';
                    output.className = "text-xs text-emerald-400 font-bold font-mono";
                    output.style.opacity = '1';
                }, 200);
            }
        }

        // Slide 13: Interactive Tokenization Simulation
        function simulateTokenize() {
            const box = document.getElementById('token-box');
            if (!box) return;
            box.style.opacity = '0';
            setTimeout(() => {
                box.innerHTML = `
                    <span class="bg-indigo-500/10 text-indigo-300 border border-indigo-500/20 px-3 py-1.5 rounded-lg font-mono text-xs font-bold animate-bounce">"Saya"</span>
                    <span class="bg-indigo-500/10 text-indigo-300 border border-indigo-500/20 px-3 py-1.5 rounded-lg font-mono text-xs font-bold animate-bounce" style="animation-delay: 0.1s">"suka"</span>
                    <span class="bg-indigo-500/10 text-indigo-300 border border-indigo-500/20 px-3 py-1.5 rounded-lg font-mono text-xs font-bold animate-bounce" style="animation-delay: 0.2s">"belajar"</span>
                    <span class="bg-indigo-500/10 text-indigo-300 border border-indigo-500/20 px-3 py-1.5 rounded-lg font-mono text-xs font-bold animate-bounce" style="animation-delay: 0.3s">"NLP"</span>
                `;
                box.style.opacity = '1';
            }, 200);
        }

        // Slide 28: Interactive ChatGPT Token Generation Typing Simulator
        function simulateChatGptText() {
            const target = document.getElementById('chatgpt-output');
            if (!target) return;
            
            const words = [
                "ChatGPT", " adalah", " model", " bahasa", " besar", " (LLM)", 
                " yang", " dilatih", " oleh", " OpenAI", " menggunakan", " arsitektur", 
                " Transformer", " untuk", " memprediksi", " kata", " selanjutnya", 
                " secara", " cerdas", " dan", " terstruktur."
            ];
            
            target.innerHTML = "";
            let index = 0;
            
            function typeNextToken() {
                if (index < words.length) {
                    target.innerHTML += words[index];
                    index++;
                    setTimeout(typeNextToken, 80);
                }
            }
            typeNextToken();
        }

        // Keyboard arrow key navigation and control triggers
        window.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowRight' || e.key === ' ' || e.key === 'Enter') {
                e.preventDefault();
                nextSlide();
            } else if (e.key === 'ArrowLeft') {
                e.preventDefault();
                prevSlide();
            }
        });

        // Initialize presentation on window load
        window.onload = () => {
            initSelector();
            renderSlide();
        };
    </script>
</body>
</html>
